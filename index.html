    <link rel="alternate" type="application/rss+xml" title="Flux RSS DIONYSIA" href="/rss.xml" />
    <script>
      try {
        const savedLanguage = localStorage.getItem('dionysia-language');
        const browserLanguage = (navigator.languages && navigator.languages[0]) || navigator.language || 'fr';
        const preferredLanguage = savedLanguage === 'fr' || savedLanguage === 'en'
          ? savedLanguage
          : (browserLanguage.toLowerCase().startsWith('en') ? 'en' : 'fr');
        document.documentElement.lang = preferredLanguage;
        if (preferredLanguage === 'en') {
          document.documentElement.classList.add('translation-pending');
          document.cookie = 'googtrans=/fr/en; path=/; max-age=31536000; SameSite=Lax';
        }
      } catch (_) {
        document.documentElement.lang = 'fr';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
